# Render Blueprint — one Web Service that serves the static site + /api/contact.
# Render → New → Blueprint → pick this repo. Fill the three env vars when prompted
# (they're marked sync:false so they're NOT stored in git).
services:
  - type: web
    name: indigital-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CONTACT_TO
        sync: false
